<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Prince of Persia - Classic Platformer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: #060606;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            min-height: 100vh;
            overflow: hidden;
            color: white;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 50% 18%, rgba(255, 215, 0, 0.12), transparent 32%),
                linear-gradient(135deg, #060606, #171007 52%, #050505);
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: minmax(210px, 280px) minmax(0, 800px) minmax(210px, 280px);
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 74px 24px 24px;
        }

        .game-header {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 10px;
        }

        .nav-button {
            min-height: 38px;
            padding: 10px 18px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 6px;
            color: white;
            background: linear-gradient(135deg, #6c757d, #5a6268);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .nav-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
        }

        .nav-button.blue {
            background: linear-gradient(135deg, #2196f3, #1976d2);
        }

        #game-wrapper {
            position: relative;
            grid-column: 2;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4 / 3;
            margin: 0 auto;
            overflow: hidden;
            border: 3px solid #ffd700;
            border-radius: 8px;
            background: #000;
            box-shadow: 0 0 32px rgba(255, 215, 0, 0.34), 0 28px 70px rgba(0, 0, 0, 0.6);
        }

        #game-iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .loading {
            position: absolute;
            z-index: 10;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 260px;
            padding: 34px;
            border: 1px solid rgba(255, 215, 0, 0.36);
            border-radius: 10px;
            color: #ffd700;
            background: rgba(0, 0, 0, 0.82);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            font-size: 24px;
            font-weight: 700;
        }

        .loading small {
            display: block;
            margin-top: 10px;
            font-size: 15px;
            font-weight: 500;
        }

        .controls-info {
            position: relative;
            grid-column: 1;
            width: 100%;
            max-width: 280px;
            padding: 18px 20px;
            border: 2px solid #ffd700;
            border-radius: 10px;
            color: #ffd700;
            background: rgba(0, 0, 0, 0.9);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            font-size: 14px;
        }

        .controls-info h3 {
            margin-bottom: 8px;
            color: #ffd700;
            font-size: 18px;
        }

        .controls-info p {
            margin: 4px 0;
            color: #fff;
        }

        .controls-info .note {
            margin-top: 8px;
            color: #ccc;
            font-size: 12px;
        }

        @media (max-width: 1080px) {
            .game-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
                align-content: center;
                padding: 76px 14px 14px;
            }

            #game-wrapper {
                grid-column: 1;
                width: min(100%, 800px);
            }

            .controls-info {
                grid-column: 1;
                justify-self: center;
                max-width: min(100%, 800px);
                padding: 12px 14px;
            }
        }

        @media (max-width: 560px) {
            .game-container {
                gap: 12px;
            }

            .controls-info {
                font-size: 12px;
            }

            .nav-button {
                padding: 9px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <button class="nav-button" id="backToMainMenuBtn" onclick="if(confirm('Are you sure you want to leave the game and return to the main menu?')) { window.location.href = '/'; }">
                &lt;- Back to Main Menu
            </button>
            <button class="nav-button blue" id="backToMenuBtn" onclick="if(confirm('Are you sure you want to return to the Prince of Persia menu?')) { window.location.reload(); }">
                Prince of Persia Menu
            </button>
        </div>

        <div class="controls-info">
            <h3>Controls</h3>
            <p><strong>Arrow Keys:</strong> Move Left/Right</p>
            <p><strong>Up Arrow:</strong> Jump</p>
            <p><strong>Spacebar:</strong> Draw Sword / Attack</p>
            <p class="note">Classic Prince of Persia (1989) - original Apple II version</p>
        </div>

        <div id="game-wrapper">
            <div class="loading" id="loading-message">
                Loading Prince of Persia...
                <small>Initializing game...</small>
            </div>
            <iframe id="game-iframe" src="https://princejs.com/" allow="gamepad; fullscreen" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
        </div>
    </div>

    <script>
        const gameIframe = document.getElementById('game-iframe');
        const loadingMessage = document.getElementById('loading-message');

        gameIframe.style.display = 'block';

        gameIframe.addEventListener('load', () => {
            console.log('Prince of Persia game loaded');
            setTimeout(() => {
                if (loadingMessage) {
                    loadingMessage.style.display = 'none';
                }
            }, 1000);
        });

        setTimeout(() => {
            if (loadingMessage) {
                loadingMessage.style.display = 'none';
            }
        }, 2000);
    </script>
</body>
</html>
