<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Truco Menu</title>
    <script>
        window.queueTrucoLobbyAction = function(action, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            if (window.trucoLobbyPointerHandled && event && event.type === 'click') {
                return;
            }

            const actionMap = {
                create: window.createRoom,
                join: window.joinRoom
            };

            if (window.trucoLobbyReady && typeof actionMap[action] === 'function') {
                window.pendingTrucoLobbyAction = null;
                actionMap[action]();
                return;
            }

            window.pendingTrucoLobbyAction = action;
            if (!window.pendingTrucoLobbyRetry) {
                window.pendingTrucoLobbyRetry = setTimeout(() => {
                    const pendingAction = window.pendingTrucoLobbyAction;
                    window.pendingTrucoLobbyRetry = null;
                    if (pendingAction) {
                        window.queueTrucoLobbyAction(pendingAction);
                    }
                }, 50);
            }
        };

        window.queueTrucoLobbyPointerAction = function(action, event) {
            if (window.trucoLobbyPointerHandled) {
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                return;
            }

            window.trucoLobbyPointerHandled = true;
            window.queueTrucoLobbyAction(action, event);

            setTimeout(() => {
                window.trucoLobbyPointerHandled = false;
            }, 500);
        };
    </script>
    <script src="/libraries/p5.min.js"></script>
    <script src="/libraries/p5.sound.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/lobby-fixes.css">
    <style>
      /* Force TRUCO button to have red background and 15% smaller size */
      .truco-button,
      [id*="truco"]:not([id*="instructions"]),
      button[style*="TRUCO"] {
        background-color: #dc3545 !important;
        background: #dc3545 !important;
        font-size: 30px !important;
        padding: 30px 60px !important;
        border: 3px solid #fff !important;
        border-radius: 17px !important;
        box-shadow: 0 13px 26px rgba(0,0,0,0.7) !important;
        transform: scale(0.51) !important;
      }
      
      /* Ensure Instructions button has proper styling */
      #instructionsButton {
        background-color: rgba(0, 0, 0, 0.7) !important;
        background: rgba(0, 0, 0, 0.7) !important;
        color: white !important;
        font-size: 14px !important;
        padding: 10px 20px !important;
        border: 2px solid #fff !important;
        border-radius: 5px !important;
        transform: none !important;
        box-shadow: none !important;
      }
      
      /* Ensure Card Values button has proper styling */
      #cardValuesButton {
        background-color: rgba(0, 0, 0, 0.7) !important;
        background: rgba(0, 0, 0, 0.7) !important;
        color: white !important;
        font-size: 14px !important;
        padding: 10px 20px !important;
        border: 2px solid #fff !important;
        border-radius: 5px !important;
        transform: none !important;
        box-shadow: none !important;
      }
      
      /* Additional rule for p5.js buttons */
      canvas + button,
      button[style*="position: absolute"][style*="z-index: 200"] {
        background-color: #dc3545 !important;
        background: #dc3545 !important;
        font-size: 30px !important;
        padding: 30px 60px !important;
        border: 3px solid #fff !important;
        border-radius: 17px !important;
        box-shadow: 0 13px 26px rgba(0,0,0,0.7) !important;
        transform: scale(0.51) !important;
      }

      #Menu {
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 24px !important;
        padding: 28px !important;
        background:
          radial-gradient(circle at 26% 18%, rgba(255, 157, 71, 0.2), transparent 28%),
          radial-gradient(circle at 78% 24%, rgba(77, 154, 255, 0.16), transparent 30%),
          linear-gradient(135deg, rgba(5, 17, 15, 0.3), rgba(12, 38, 27, 0.1));
      }

      #Menu .truco-menu-brand {
        position: relative !important;
        top: auto !important;
        left: auto !important;
        transform: none !important;
        display: grid;
        justify-items: center;
        gap: 10px;
        pointer-events: none;
        z-index: 4;
      }

      #Menu .truco-menu-brand h1 {
        margin: 0;
        color: #fff3cf;
        font-size: clamp(56px, 10vw, 116px);
        line-height: 0.86;
        letter-spacing: 0;
        text-shadow: 0 18px 44px rgba(0, 0, 0, 0.52), 0 0 18px rgba(255, 201, 93, 0.18);
      }

      .truco-card-fan {
        position: relative;
        width: 176px;
        height: 74px;
      }

      .truco-card-fan span {
        position: absolute;
        top: 4px;
        left: 50%;
        width: 48px;
        height: 68px;
        border-radius: 7px;
        background: #fffaf0;
        border: 2px solid rgba(26, 18, 12, 0.75);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.36);
      }

      .truco-card-fan span:nth-child(1) {
        transform: translateX(-82px) rotate(-15deg);
      }

      .truco-card-fan span:nth-child(2) {
        transform: translateX(-24px) rotate(-3deg);
      }

      .truco-card-fan span:nth-child(3) {
        transform: translateX(34px) rotate(13deg);
      }

      .truco-card-fan span::before {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 5px;
        background:
          linear-gradient(135deg, rgba(220, 53, 69, 0.86), transparent 48%),
          linear-gradient(315deg, rgba(33, 150, 243, 0.72), transparent 48%);
      }

      #Menu .room-controls {
        position: relative !important;
        top: auto !important;
        left: auto !important;
        transform: none !important;
        width: min(760px, calc(100vw - 40px)) !important;
        min-width: 0 !important;
        padding: 22px !important;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: rgba(6, 10, 9, 0.82) !important;
        border: 1px solid rgba(255, 214, 112, 0.45) !important;
        border-radius: 8px !important;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.48) !important;
        backdrop-filter: blur(14px);
      }

      #Menu .room-controls input,
      #Menu .room-controls button {
        border-radius: 8px !important;
        margin: 0 !important;
      }

      #Menu #roomInput {
        width: 210px;
        padding: 12px 14px !important;
        background: rgba(255, 250, 238, 0.96) !important;
        border: 1px solid rgba(255, 214, 112, 0.8) !important;
        color: #17120d !important;
        text-align: center;
        text-shadow: none !important;
      }

      #Menu #playerCustomization,
      #Menu #playerList,
      #Menu #roomCodeDisplay {
        flex-basis: 100%;
      }

      #Menu #playerCustomization {
        border-color: rgba(255, 214, 112, 0.42) !important;
        background: rgba(20, 49, 33, 0.62) !important;
      }

      #Menu #playerList {
        display: grid;
        gap: 8px;
        max-height: 190px;
        overflow: auto;
      }

      #Menu #playerList > div {
        border-radius: 8px !important;
        background: rgba(13, 72, 38, 0.74) !important;
        border: 1px solid rgba(105, 221, 128, 0.42) !important;
      }

      #instructionsButton,
      #cardValuesButton {
        border-radius: 8px !important;
        background: rgba(7, 10, 12, 0.78) !important;
        border: 1px solid rgba(255, 255, 255, 0.72) !important;
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.3) !important;
      }

      @media (max-width: 760px) {
        #Menu {
          justify-content: flex-start !important;
          padding-top: 34px !important;
          gap: 18px !important;
        }

        #Menu .room-controls {
          padding: 16px !important;
        }

        #Menu #roomInput {
          width: min(100%, 260px);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div id="Menu">
        <div class="truco-menu-brand">
          <h1>TRUCO</h1>
          <div class="truco-card-fan" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
        <div id="roomControls" class="room-controls">
          <!-- Back to Main Menu Button -->
          <button id="backToMainMenu" onclick="console.log('🔙 Back to Main Menu clicked'); window.location.replace('/');" style="background: #6c757d; color: white; border: none; padding: 8px 16px; border-radius: 4px; margin-right: 10px; cursor: pointer; font-size: 14px;">
            ← Back to Main Menu
          </button>
          
          <!-- ✅ Reconnection UI -->
          <div id="reconnectionUI" style="display: none; margin: 10px 0; padding: 10px; border: 2px solid #f44336; border-radius: 6px; background-color: rgba(244, 67, 54, 0.1); text-align: center;">
            <h4 style="color: #f44336; margin: 0 0 6px 0; font-size: 15px;">⚠️ Connection Lost</h4>
            <div id="reconnectionMessage" style="color: #f44336; margin-bottom: 6px; font-size: 13px;">Connection lost. Attempting to reconnect...</div>
            <div style="color: #666; font-size: 12px;">Please wait while we reconnect to the server...</div>
          </div>
          
          <input type="text" id="roomInput" placeholder="Room Code" />
          <button id="createRoomBtn" onpointerdown="window.queueTrucoLobbyPointerAction('create', event)" onclick="window.queueTrucoLobbyAction('create', event)" disabled>Create Room</button>
          <button id="joinRoomBtn" onpointerdown="window.queueTrucoLobbyPointerAction('join', event)" onclick="window.queueTrucoLobbyAction('join', event)" disabled>Join Room</button>
          
          <!-- Room Code Display with Copy Button Next to Yellow Box -->
                <div id="roomCodeDisplay" style="display: none; margin: 10px 0; text-align: center;">
                  <div style="margin: 5px 0; font-size: 16px; color: white; display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <div id="roomCodeText" style="background-color: #FFD700; color: black; font-family: monospace; font-size: 18px; padding: 8px 12px; border-radius: 4px; font-weight: bold;"></div>
                    <button id="copyRoomCodeBtn" style="background-color: #4CAF50; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px;">
                      📋 Copy
                    </button>
                  </div>
                  <div id="copySuccessMessage" style="display: none; color: #4CAF50; margin-top: 5px; font-weight: bold; font-size: 12px;">✅ Room code copied to clipboard!</div>
                </div>
          
          <!-- Player Customization Section -->
          <div id="playerCustomization" style="margin: 10px 0; padding: 10px; border: 2px solid #4CAF50; border-radius: 6px; background-color: rgba(76, 175, 80, 0.1); display: none;">
            <h4 style="margin: 0 0 8px 0; font-size: 16px;">🎯 Customize Your Player</h4>
            
            <!-- Nickname Change -->
            <div style="margin: 6px 0;">
              <label for="nicknameInput" style="font-size: 14px;">Nickname (max 12 chars):</label>
              <input type="text" id="nicknameInput" maxlength="12" placeholder="Enter nickname" style="margin-left: 8px; padding: 4px; border: 1px solid #ccc; border-radius: 3px; font-size: 13px;">
              <button id="changeNicknameBtn" style="margin-left: 6px; padding: 4px 8px; background-color: #2196F3; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 13px;">Change</button>
            </div>
            
            <!-- Team Selection -->
            <div style="margin: 6px 0;">
              <label style="font-size: 14px;">Choose Team:</label>
              <button id="team1Btn" style="margin-left: 8px; padding: 6px 12px; background-color: #FF9800; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 13px;">Team Alfa</button>
              <button id="team2Btn" style="margin-left: 6px; padding: 6px 12px; background-color: #9C27B0; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 13px;">Team Beta</button>
            </div>
          </div>
          
          <button id="addBotBtn" style="display: none;">Add Bot</button>
          <button id="removeBotBtn" style="display: none;">Remove Bot</button>
          <button id="startGameBtn" style="display: none;" disabled>Start Game</button>

          <button id="backToMainMenuBtn" style="display: none;">← Back to Truco Menu</button>
          <div id="playerList"></div>
        </div>
      </div>
      <div id="Instructions"></div>
      <div id="Values"></div>
      <div id="Game">
        <!-- ✅ Navigation Buttons (Top Center) -->
        <div style="display: none; position: absolute; top: 200px; left: 50%; transform: translateX(-50%); z-index: 1000; gap: 10px;" id="gameNavigationButtons">
          <button id="gameBackToMainMenuBtn" style="background: linear-gradient(135deg, #6c757d, #5a6268); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: all 0.3s ease;">
            ← Back to Main Menu
          </button>
          <button id="gameBackToMenuBtn" style="background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: all 0.3s ease;">
            🏠 Back to Menu
          </button>
        </div>

        <!-- ✅ Poker Betting Controls -->
        <div id="bettingControls" style="display: none; position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; background: linear-gradient(135deg, #2c3e50, #34495e); padding: 20px; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.4); border: 2px solid #3498db;">
          <div style="text-align: center; margin-bottom: 15px;">
            <h3 style="margin: 0; color: #FFD700; font-size: 18px;">🎯 Your Turn</h3>
          </div>
          
          <div style="display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;">
            <!-- Bet Amount Input -->
            <div style="display: flex; flex-direction: column; align-items: center;">
              <label style="color: #ecf0f1; font-size: 14px; margin-bottom: 5px;">Bet Amount:</label>
              <input type="number" id="betAmount" min="0" step="1" value="0" style="width: 80px; padding: 8px; border: 2px solid #3498db; border-radius: 5px; text-align: center; font-size: 16px; font-weight: bold; background: #ecf0f1; color: #2c3e50;">
            </div>
            
            <!-- Action Buttons -->
            <div style="display: flex; gap: 8px;">
              <button id="foldBtn" style="padding: 10px 16px; background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.3); transition: all 0.3s ease;">
                🚫 Fold
              </button>
              <button id="callBtn" style="padding: 10px 16px; background: linear-gradient(135deg, #f39c12, #e67e22); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.3); transition: all 0.3s ease;">
                ✅ Call
              </button>
              <button id="raiseBtn" style="padding: 10px 16px; background: linear-gradient(135deg, #27ae60, #229954); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.3); transition: all 0.3s ease;">
                📈 Raise
              </button>
              <button id="allInBtn" style="padding: 10px 16px; background: linear-gradient(135deg, #8e44ad, #9b59b6); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.3); transition: all 0.3s ease;">
                🎯 All In
              </button>
            </div>
          </div>
          
          <!-- Current Bet Info -->
          <div id="currentBetInfo" style="text-align: center; margin-top: 10px; color: #ecf0f1; font-size: 14px;">
            <!-- Current bet information will be displayed here -->
          </div>
        </div>
        
        <!-- ✅ Round History Button (Below TRUCO - Left) -->
        <button id="roundHistoryBtn" style="display: none; position: fixed !important; bottom: 80px !important; top: auto !important; left: 50% !important; transform: translateX(-150px) !important; z-index: 3000 !important; background: linear-gradient(135deg, #4CAF50, #45a049) !important; color: white !important; border: none !important; padding: 10px 20px !important; border-radius: 8px !important; font-size: 14px !important; font-weight: bold !important; cursor: pointer !important; box-shadow: 0 4px 8px rgba(0,0,0,0.3) !important; pointer-events: auto !important;">
          📋 Round History
        </button>
        
        <!-- ✅ Card Values Button (Below TRUCO - Right) -->
        <button id="gameCardValuesBtn" style="display: none; position: fixed !important; bottom: 80px !important; top: auto !important; left: 50% !important; transform: translateX(50px) !important; z-index: 3000 !important; background: linear-gradient(135deg, #3498db, #2980b9) !important; color: white !important; border: none !important; padding: 10px 20px !important; border-radius: 8px !important; font-size: 14px !important; font-weight: bold !important; cursor: pointer !important; box-shadow: 0 4px 8px rgba(0,0,0,0.3) !important; transition: all 0.3s ease !important; pointer-events: auto !important;">
          🃏 Card Values
        </button>
        
        <!-- ✅ Round History Modal -->
        <div id="roundHistoryModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000;">
          <!-- Close button positioned outside scrollable area -->
          <button id="closeRoundHistoryBtn" style="position: fixed; top: 20px; right: 20px; background: #e74c3c; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 16px; z-index: 2001; box-shadow: 0 2px 5px rgba(0,0,0,0.3);">✕</button>
          <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(135deg, #2c3e50, #34495e); color: white; padding: 30px; border-radius: 15px; max-width: 600px; max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <div style="text-align: center; margin-bottom: 20px;">
              <h2 style="margin: 0; color: #FFD700;">🏆 Round History</h2>
            </div>
            <div id="roundHistoryContent" style="text-align: left;">
              <!-- Round history content will be populated here -->
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="js/variables.js"></script>
    <script src="js/players.js"></script>
    <script src="js/preload.js"></script>
    <script src="js/game-framework.js"></script>
    <script src="js/game.js"></script>
    <script src="js/functions.js"></script>
    <script src="js/setup.js"></script>
    <script src="js/draw.js"></script>
    <script src="js/lobby.js"></script>
  </body>
</html>
